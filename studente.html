<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regia · Postazione</title>
<style>
  :root{
    --verde:#1B6D3F; --verde-scuro:#0F4527; --verde-chiaro:#E7F2EB;
    --ambra:#C98A12; --blu:#2563A8; --carta:#F6F8F6; --inchiostro:#16211A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0B1510;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .vista{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:22px;padding:40px}
  .vista.on{display:flex}
  h1{font-size:clamp(28px,4vw,56px);font-weight:700;letter-spacing:-.01em}
  p.sotto{font-size:clamp(16px,1.8vw,24px);opacity:.75;max-width:900px;line-height:1.4}
  svg.ico{width:96px;height:96px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* Entra */
  #v-entra{background:radial-gradient(circle at 50% 35%,#21804B 0%,var(--verde) 35%,var(--verde-scuro) 100%)}
  .btn-entra{font:inherit;font-size:28px;font-weight:700;color:var(--verde-scuro);background:#fff;border:0;border-radius:999px;padding:22px 64px;cursor:pointer;box-shadow:0 12px 40px rgba(0,0,0,.25);transition:transform .15s}
  .btn-entra:hover{transform:scale(1.04)}
  .postazione{font-size:15px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}

  /* Attesa */
  #v-attesa{background:var(--verde-scuro)}
  .pulsa{animation:pulsa 2.4s ease-in-out infinite}
  @keyframes pulsa{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}

  /* Live */
  #v-live{background:#000;padding:0}
  #video{width:100%;height:100%;object-fit:contain;background:#000}

  /* Occhi */
  #v-occhi{background:var(--verde)}
  #v-occhi h1{font-size:clamp(40px,6vw,96px)}

  /* Prova */
  #v-prova{padding:0;gap:0;background:var(--carta)}
  .barra{width:100%;height:44px;flex:0 0 44px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--verde);color:#fff;font-size:15px}
  .barra svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .barra .tit{font-weight:700}
  .barra .spazio{flex:1}
  .barra .nota{opacity:.8;font-size:13px}
  #frame{width:100%;flex:1;border:0;background:#fff}

  /* Stato connessione */
  #stato{position:fixed;right:14px;bottom:12px;font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;gap:8px;z-index:10;transition:opacity .4s}
  #stato i{width:8px;height:8px;border-radius:50%;background:var(--ambra);display:inline-block}
  #stato.ok i{background:#4CC27A}
  #stato.ok{opacity:0}
  body:hover #stato.ok{opacity:.8}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-schermo" viewBox="0 0 24 24"><rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 16.5v4"/></symbol>
  <symbol id="i-occhio" viewBox="0 0 24 24"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></symbol>
  <symbol id="i-mano" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5V4a1.5 1.5 0 0 1 3 0v6m0-4.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1.2a7 7 0 0 1-5.3-2.4L3 16.3a1.6 1.6 0 0 1 2.3-2.2L8 16"/></symbol>
  <symbol id="i-orologio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</svg>

<section id="v-entra" class="vista on">
  <svg class="ico"><use href="#i-schermo"/></svg>
  <h1>Regia di laboratorio</h1>
  <button class="btn-entra" id="btnEntra">Entra</button>
  <div class="postazione" id="lblPostazione"></div>
</section>

<section id="v-attesa" class="vista">
  <svg class="ico pulsa"><use href="#i-orologio"/></svg>
  <h1 id="attesaTitolo">In attesa del docente…</h1>
  <p class="sotto" id="attesaSotto">Resta su questa schermata: la spiegazione partirà da sola.</p>
</section>

<section id="v-live" class="vista">
  <video id="video" autoplay playsinline muted></video>
</section>

<section id="v-occhi" class="vista">
  <svg class="ico"><use href="#i-occhio"/></svg>
  <h1 id="occhiMsg">Occhi al docente</h1>
</section>

<section id="v-prova" class="vista">
  <div class="barra">
    <svg><use href="#i-mano"/></svg>
    <span class="tit" id="provaTitolo">Prova tu</span>
    <span class="spazio"></span>
    <span class="nota">Quando il docente ti richiama, lo schermo torna da solo alla spiegazione</span>
  </div>
  <iframe id="frame" title="Attività" allow="fullscreen; autoplay; clipboard-write; microphone"></iframe>
</section>

<div id="stato"><i></i><span id="statoTxt">Connessione…</span></div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
<script>
(() => {
  const { Room, RoomEvent, Track } = LivekitClient;
  const qs = new URLSearchParams(location.search);
  const STANZA = qs.get('stanza') || 'lab';
  const NOME = (qs.get('pc') || leggi('regia_pc') || ('Postazione-' + Math.random().toString(36).slice(2, 6))).slice(0, 24);
  scrivi('regia_pc', NOME);

  const $ = id => document.getElementById(id);
  const video = $('video'), frame = $('frame');
  let room = null, tracciaSchermo = null, entrato = false, tentativi = 0;

  $('lblPostazione').textContent = NOME + ' · stanza ' + STANZA;

  function leggi(k){ try { return localStorage.getItem(k); } catch { return null; } }
  function scrivi(k,v){ try { localStorage.setItem(k,v); } catch {} }

  function mostra(id){
    document.querySelectorAll('.vista').forEach(v => v.classList.toggle('on', v.id === id));
  }
  function stato(txt, ok){
    $('statoTxt').textContent = txt;
    $('stato').classList.toggle('ok', !!ok);
  }

  function docente(){
    if (!room) return null;
    for (const p of room.remoteParticipants.values()) if (p.identity === 'docente') return p;
    return null;
  }

  // Unica funzione che decide cosa vede lo studente
  function applica(){
    if (!entrato) return;
    const d = docente();
    if (!d){
      $('attesaTitolo').textContent = 'In attesa del docente…';
      $('attesaSotto').textContent = 'Resta su questa schermata: la spiegazione partirà da sola.';
      return mostra('v-attesa');
    }
    const a = d.attributes || {};
    const modo = a.modo || 'attesa';

    if (modo === 'prova' && a.url){
      if (frame.dataset.url !== a.url){ frame.src = a.url; frame.dataset.url = a.url; }
      $('provaTitolo').textContent = a.titolo ? 'Prova tu · ' + a.titolo : 'Prova tu';
      return mostra('v-prova');
    }
    if (modo === 'occhi'){
      $('occhiMsg').textContent = a.msg || 'Occhi al docente';
      return mostra('v-occhi');
    }
    if (modo === 'live' && tracciaSchermo){
      return mostra('v-live');
    }
    $('attesaTitolo').textContent = modo === 'live' ? 'Il docente sta preparando lo schermo…' : 'Tra poco si parte';
    $('attesaSotto').textContent = 'Resta su questa schermata.';
    mostra('v-attesa');
  }

  async function prendiGettone(){
    const r = await fetch('/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ruolo: 'studente', stanza: STANZA, nome: NOME })
    });
    if (!r.ok) throw new Error('Gettone non disponibile (' + r.status + ')');
    return r.json();
  }

  async function connetti(){
    stato('Connessione…', false);
    try {
      const { token, url } = await prendiGettone();
      room = new Room({ adaptiveStream: true, dynacast: true });

      room
        .on(RoomEvent.TrackSubscribed, (track, pub, p) => {
          if (p.identity === 'docente' && track.source === Track.Source.ScreenShare){
            tracciaSchermo = track; track.attach(video); applica();
          }
        })
        .on(RoomEvent.TrackUnsubscribed, (track, pub, p) => {
          if (track === tracciaSchermo){ track.detach(video); tracciaSchermo = null; applica(); }
        })
        .on(RoomEvent.ParticipantAttributesChanged, applica)
        .on(RoomEvent.ParticipantConnected, applica)
        .on(RoomEvent.ParticipantDisconnected, p => { if (p.identity === 'docente'){ tracciaSchermo = null; } applica(); })
        .on(RoomEvent.Reconnecting, () => stato('Riconnessione…', false))
        .on(RoomEvent.Reconnected, () => stato('Collegato', true))
        .on(RoomEvent.Disconnected, () => {
          stato('Disconnesso: riprovo…', false);
          tracciaSchermo = null; room = null; applica();
          setTimeout(connetti, 3000);
        });

      await room.connect(url, token, { autoSubscribe: true });
      tentativi = 0;
      stato('Collegato · ' + NOME, true);
      applica();
    } catch (e) {
      console.warn('[Regia]', e);
      room = null;
      tentativi++;
      stato('Non collegato: riprovo…', false);
      setTimeout(connetti, Math.min(15000, 2000 * tentativi));
    }
  }

  function entra(){
    if (entrato) return;
    entrato = true;
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    applica();
  }

  $('btnEntra').addEventListener('click', entra);
  // ?auto=1 salta il pulsante (niente schermo intero: serve un clic dell'utente)
  if (qs.get('auto') === '1') entra();
  connetti();
})();
</script>
</body>
</html>
