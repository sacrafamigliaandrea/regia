<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regia · Postazione</title>
<style>
  :root{
    --verde:#1B6D3F; --verde-scuro:#0F4527; --verde-chiaro:#E7F2EB;
    --ambra:#C98A12; --blu:#2563A8; --carta:#F6F8F6; --inchiostro:#16211A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0B1510;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .vista{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:22px;padding:40px}
  .vista.on{display:flex}
  h1{font-size:clamp(28px,4vw,56px);font-weight:700;letter-spacing:-.01em}
  p.sotto{font-size:clamp(16px,1.8vw,24px);opacity:.75;max-width:900px;line-height:1.4}
  svg.ico{width:96px;height:96px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

  /* Entra */
  #v-entra{background:radial-gradient(circle at 50% 35%,#21804B 0%,var(--verde) 35%,var(--verde-scuro) 100%)}
  .btn-entra{font:inherit;font-size:28px;font-weight:700;color:var(--verde-scuro);background:#fff;border:0;border-radius:999px;padding:22px 64px;cursor:pointer;box-shadow:0 12px 40px rgba(0,0,0,.25);transition:transform .15s}
  .btn-entra:hover{transform:scale(1.04)}
  .postazione{font-size:15px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}

  /* Attesa */
  #v-attesa{background:var(--verde-scuro)}
  .pulsa{animation:pulsa 2.4s ease-in-out infinite}
  @keyframes pulsa{0%,100%{opacity:.35;transform:scale(.96)}50%{opacity:1;transform:scale(1)}}

  /* Live */
  #v-live{background:#000;padding:0}
  #video{width:100%;height:100%;object-fit:contain;background:#000}

  /* Occhi */
  #v-occhi{background:var(--verde)}
  #v-occhi h1{font-size:clamp(40px,6vw,96px)}

  /* Prova */
  #v-prova{padding:0;gap:0;background:var(--carta)}
  .barra{width:100%;height:44px;flex:0 0 44px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--verde);color:#fff;font-size:15px}
  .barra svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .barra .tit{font-weight:700}
  .barra .spazio{flex:1}
  .barra .nota{opacity:.8;font-size:13px}
  #frame{width:100%;flex:1;border:0;background:#fff}

  /* Video sincronizzato */
  #v-video{padding:0;background:#000}
  #ytBox{position:absolute;inset:0}
  #ytBox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
  #ytPoster,#ytFine{position:absolute;inset:0;background:#000 center/contain no-repeat;display:flex;align-items:center;justify-content:center}
  #ytFine{background:rgba(11,21,16,.97);display:none;flex-direction:column;gap:14px;font-size:clamp(22px,3vw,40px);font-weight:700}
  #ytScudo{position:absolute;inset:0}

  /* Stato connessione */
  #stato{position:fixed;right:14px;bottom:12px;font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;gap:8px;z-index:10;transition:opacity .4s}
  #stato i{width:8px;height:8px;border-radius:50%;background:var(--ambra);display:inline-block}
  #stato.ok i{background:#4CC27A}
  #stato.ok{opacity:0}
  body:hover #stato.ok{opacity:.8}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-schermo" viewBox="0 0 24 24"><rect x="2.5" y="3.5" width="19" height="13" rx="2"/><path d="M8 20.5h8M12 16.5v4"/></symbol>
  <symbol id="i-occhio" viewBox="0 0 24 24"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></symbol>
  <symbol id="i-mano" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5V4a1.5 1.5 0 0 1 3 0v6m0-4.5a1.5 1.5 0 0 1 3 0V12m0-3.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1.2a7 7 0 0 1-5.3-2.4L3 16.3a1.6 1.6 0 0 1 2.3-2.2L8 16"/></symbol>
  <symbol id="i-orologio" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
</svg>

<section id="v-entra" class="vista on">
  <svg class="ico"><use href="#i-schermo"/></svg>
  <h1>Regia di laboratorio</h1>
  <button class="btn-entra" id="btnEntra">Entra</button>
  <div class="postazione" id="lblPostazione"></div>
</section>

<section id="v-attesa" class="vista">
  <svg class="ico pulsa"><use href="#i-orologio"/></svg>
  <h1 id="attesaTitolo">In attesa del docente…</h1>
  <p class="sotto" id="attesaSotto">Resta su questa schermata: la spiegazione partirà da sola.</p>
</section>

<section id="v-live" class="vista">
  <video id="video" autoplay playsinline muted></video>
  <audio id="audio" autoplay></audio>
</section>

<section id="v-fine" class="vista" style="background:var(--verde-scuro)">
  <svg class="ico"><use href="#i-schermo"/></svg>
  <h1>Lezione terminata</h1>
  <p class="sotto">Grazie! Puoi chiudere questa finestra.</p>
  <button class="btn-entra" id="btnRientra" style="font-size:18px;padding:14px 34px">Rientra</button>
</section>

<section id="v-occhi" class="vista">
  <svg class="ico"><use href="#i-occhio"/></svg>
  <h1 id="occhiMsg">Occhi al docente</h1>
</section>

<section id="v-video" class="vista">
  <div id="ytBox"><div id="ytPlayer"></div></div>
  <div id="ytPoster"></div>
  <div id="ytFine"><svg class="ico"><use href="#i-occhio"/></svg>Occhi al docente</div>
  <div id="ytScudo"></div>
</section>

<section id="v-prova" class="vista">
  <div class="barra">
    <svg><use href="#i-mano"/></svg>
    <span class="tit" id="provaTitolo">Prova tu</span>
    <span class="spazio"></span>
    <span class="nota">Quando il docente ti richiama, lo schermo torna da solo alla spiegazione</span>
  </div>
  <iframe id="frame" title="Attività" allow="fullscreen; autoplay; clipboard-write; microphone"></iframe>
</section>

<div id="stato"><i></i><span id="statoTxt">Connessione…</span></div>
<button id="btnAudio" style="display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;font:inherit;font-size:18px;font-weight:700;border:0;border-radius:999px;padding:14px 30px;background:#fff;color:#0F4527;box-shadow:0 8px 30px rgba(0,0,0,.35);cursor:pointer">Tocca per attivare l'audio</button>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.js"></script>
<script>
(() => {
  const { Room, RoomEvent, Track } = LivekitClient;
  const qs = new URLSearchParams(location.search);
  const STANZA = qs.get('stanza') || 'lab';
  const NOME = (qs.get('pc') || leggi('regia_pc') || ('Postazione-' + Math.random().toString(36).slice(2, 6))).slice(0, 24);
  scrivi('regia_pc', NOME);

  const $ = id => document.getElementById(id);
  const video = $('video'), frame = $('frame'), audio = $('audio');
  let room = null, tracciaSchermo = null, tracciaAudio = null, entrato = false, tentativi = 0;

  $('lblPostazione').textContent = NOME + ' · stanza ' + STANZA;

  function leggi(k){ try { return localStorage.getItem(k); } catch { return null; } }
  function scrivi(k,v){ try { localStorage.setItem(k,v); } catch {} }

  function mostra(id){
    document.querySelectorAll('.vista').forEach(v => v.classList.toggle('on', v.id === id));
  }
  function stato(txt, ok){
    $('statoTxt').textContent = txt;
    $('stato').classList.toggle('ok', !!ok);
  }

  function docente(){
    if (!room) return null;
    for (const p of room.remoteParticipants.values()) if (p.identity === 'docente') return p;
    return null;
  }

  // L'audio della lezione si sente solo in «Guardate me»: in «Prova tu» l'app ha il suo audio
  function aggiornaAudio(modo){ audio.muted = modo !== 'live'; }
  function aggiornaBtnAudio(){
    const serve = entrato && room && !room.canPlaybackAudio;
    $('btnAudio').style.display = serve ? 'block' : 'none';
  }

  // Unica funzione che decide cosa vede lo studente
  function applica(){
    const dd = docente();
    aggiornaAudio(dd ? (dd.attributes || {}).modo : '');
    aggiornaBtnAudio();
    if (!entrato) return;
    const d = docente();
    if (!d){
      $('attesaTitolo').textContent = 'In attesa del docente…';
      $('attesaSotto').textContent = 'Resta su questa schermata: la spiegazione partirà da sola.';
      return mostra('v-attesa');
    }
    const a = d.attributes || {};
    const modo = a.modo || 'attesa';
    if (modo === 'fine') return terminaLezione();

    if (modo === 'prova' && a.url){
      if (frame.dataset.url !== a.url){ frame.src = a.url; frame.dataset.url = a.url; }
      $('provaTitolo').textContent = a.titolo ? 'Prova tu · ' + a.titolo : 'Prova tu';
      return mostra('v-prova');
    }
    if (modo === 'video' && a.vid){
      sincronizzaVideo(a);
      return mostra('v-video');
    }
    pausaVideo();
    if (modo === 'occhi'){
      $('occhiMsg').textContent = a.msg || 'Occhi al docente';
      return mostra('v-occhi');
    }
    if (modo === 'live' && tracciaSchermo){
      return mostra('v-live');
    }
    $('attesaTitolo').textContent = modo === 'live' ? 'Il docente sta preparando lo schermo…' : 'Tra poco si parte';
    $('attesaSotto').textContent = 'Resta su questa schermata.';
    mostra('v-attesa');
  }

  // ---------- video sincronizzato ----------
  let yt = null, ytProntoP = null, ytVid = '', ytPartito = false, ytRif = null;
  const ytApi = new Promise(res => {
    window.onYouTubeIframeAPIReady = res;
    const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(sc);
  });
  function creaPlayer(id){
    ytProntoP = ytApi.then(() => new Promise(res => {
      yt = new YT.Player('ytPlayer', {
        videoId: id, host: 'https://www.youtube.com',
        playerVars: { controls: 0, disablekb: 1, rel: 0, iv_load_policy: 3, playsinline: 1, fs: 0, modestbranding: 1, enablejsapi: 1, origin: location.origin },
        events: {
          onReady: () => { yt.unMute(); yt.setVolume(100); res(); },
          onStateChange: e => {
            if (e.data === YT.PlayerState.PLAYING){ ytPartito = true; $('ytPoster').style.display = 'none'; $('ytFine').style.display = 'none'; $('btnAudio').style.display = 'none'; }
            if (e.data === YT.PlayerState.ENDED) $('ytFine').style.display = 'flex';
          }
        }
      });
    }));
    return ytProntoP;
  }
  function posizioneAttesa(a){
    const vt = parseFloat(a.vt) || 0, vts = parseInt(a.vts, 10) || Date.now();
    return a.vplay === '1' ? vt + (Date.now() - vts) / 1000 : vt;
  }
  async function sincronizzaVideo(a){
    ytRif = a;
    if (a.vid !== ytVid){
      ytVid = a.vid; ytPartito = false;
      $('ytPoster').style.backgroundImage = `url(https://i.ytimg.com/vi/${a.vid}/hqdefault.jpg)`;
      $('ytPoster').style.display = 'flex'; $('ytFine').style.display = 'none';
      if (!yt) await creaPlayer(a.vid); else { await ytProntoP; yt.cueVideoById(a.vid); }
    }
    await ytProntoP;
    allineaVideo();
  }
  function allineaVideo(){
    if (!yt || !ytRif || !yt.getPlayerState) return;
    const a = ytRif, attesa = posizioneAttesa(a), ora = yt.getCurrentTime() || 0, st = yt.getPlayerState();
    if (Math.abs(ora - attesa) > 1.2) yt.seekTo(attesa, true);
    if (a.vplay === '1' && st !== YT.PlayerState.PLAYING && st !== YT.PlayerState.BUFFERING && st !== YT.PlayerState.ENDED){
      yt.playVideo();
      // se il browser blocca l'avvio con audio, serve un tocco
      setTimeout(() => { if (yt.getPlayerState() !== YT.PlayerState.PLAYING && ytRif && ytRif.vplay === '1'){ $('btnAudio').textContent = 'Tocca per avviare il video'; $('btnAudio').style.display = 'block'; } }, 2500);
    }
    if (a.vplay !== '1' && st === YT.PlayerState.PLAYING) yt.pauseVideo();
  }
  function pausaVideo(){ ytRif = null; if (yt && yt.pauseVideo && yt.getPlayerState && yt.getPlayerState() === YT.PlayerState.PLAYING) yt.pauseVideo(); }
  setInterval(() => { if (ytRif) allineaVideo(); }, 1000);

  async function prendiGettone(){
    const r = await fetch('/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ruolo: 'studente', stanza: STANZA, nome: NOME })
    });
    if (!r.ok) throw new Error('Gettone non disponibile (' + r.status + ')');
    return r.json();
  }

  async function connetti(){
    stato('Connessione…', false);
    try {
      const { token, url } = await prendiGettone();
      room = new Room({ adaptiveStream: true, dynacast: true });

      room
        .on(RoomEvent.TrackSubscribed, (track, pub, p) => {
          if (p.identity === 'docente' && track.source === Track.Source.ScreenShare){
            tracciaSchermo = track; track.attach(video); applica();
          }
          if (p.identity === 'docente' && track.source === Track.Source.ScreenShareAudio){
            tracciaAudio = track; track.attach(audio); applica();
          }
        })
        .on(RoomEvent.TrackUnsubscribed, (track, pub, p) => {
          if (track === tracciaSchermo){ track.detach(video); tracciaSchermo = null; applica(); }
          if (track === tracciaAudio){ track.detach(audio); tracciaAudio = null; }
        })
        .on(RoomEvent.ParticipantAttributesChanged, applica)
        .on(RoomEvent.AudioPlaybackStatusChanged, aggiornaBtnAudio)
        .on(RoomEvent.ParticipantConnected, applica)
        .on(RoomEvent.ParticipantDisconnected, p => { if (p.identity === 'docente'){ tracciaSchermo = null; tracciaAudio = null; } applica(); })
        .on(RoomEvent.Reconnecting, () => stato('Riconnessione…', false))
        .on(RoomEvent.Reconnected, () => { stato('Collegato', true); segnala(true); })
        .on(RoomEvent.Disconnected, () => {
          tracciaSchermo = null; tracciaAudio = null; room = null;
          if (finita){ stato('Lezione terminata', false); return; }
          stato('Disconnesso: riprovo…', false);
          applica();
          setTimeout(connetti, 3000);
        });

      await room.connect(url, token, { autoSubscribe: true });
      tentativi = 0;
      stato('Collegato · ' + NOME, true);
      ultimaSpia = ''; segnala(true);
      applica();
    } catch (e) {
      console.warn('[Regia]', e);
      room = null;
      tentativi++;
      stato('Non collegato: riprovo…', false);
      setTimeout(connetti, Math.min(15000, 2000 * tentativi));
    }
  }

  // ---------- fine lezione ----------
  // Il docente preme «Termina lezione»: la postazione si scollega (niente minuti consumati),
  // mostra la schermata finale e prova a chiudere la finestra.
  let finita = false;
  function terminaLezione(){
    if (finita) return;
    finita = true;
    pausaVideo();
    frame.src = 'about:blank'; frame.dataset.url = '';
    mostra('v-fine');
    rilasciaVeglia();
    const r = room; room = null;
    if (r) r.disconnect().catch(() => {});
    stato('Lezione terminata', false);
    setTimeout(() => { try { window.close(); } catch {} }, 4000); // riesce se Chrome è stato aperto da ARD
  }
  $('btnRientra').addEventListener('click', () => { finita = false; mostra('v-attesa'); richiediVeglia(); connetti(); });

  // ---------- niente salvaschermo ----------
  // Screen Wake Lock: finché la pagina è visibile il Mac non avvia salvaschermo né stop dello schermo.
  let veglia = null;
  async function richiediVeglia(){
    if (finita || !('wakeLock' in navigator) || document.visibilityState !== 'visible' || veglia) return;
    try {
      veglia = await navigator.wakeLock.request('screen');
      veglia.addEventListener('release', () => { veglia = null; });
    } catch (e) { veglia = null; }
  }
  function rilasciaVeglia(){ if (veglia){ veglia.release().catch(() => {}); veglia = null; } }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') richiediVeglia(); });
  setInterval(richiediVeglia, 30000);
  richiediVeglia();

  function entra(){
    if (entrato) return;
    entrato = true;
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    richiediVeglia();
    applica();
    segnala();
  }

  // ---------- spia per il docente ----------
  // ok = pagina visibile, in primo piano e a tutto schermo (o in kiosk)
  // fuori = uscito dallo schermo intero, altra scheda/app in primo piano
  // entra = non ha ancora cliccato «Entra»
  let ultimaSpia = '';
  function schermoPieno(){
    if (document.fullscreenElement) return true;
    return Math.abs(window.innerHeight - screen.height) < 6 && Math.abs(window.innerWidth - screen.width) < 6; // kiosk
  }
  function spia(){
    if (!entrato) return 'entra';
    return (document.visibilityState === 'visible' && document.hasFocus() && schermoPieno()) ? 'ok' : 'fuori';
  }
  async function segnala(forza){
    if (!room || room.state !== 'connected') return;
    const s = spia();
    if (s === ultimaSpia && !forza) return;
    ultimaSpia = s;
    try { await room.localParticipant.setAttributes({ spia: s }); } catch (e) { ultimaSpia = ''; }
  }
  ['visibilitychange', 'fullscreenchange', 'resize'].forEach(ev => document.addEventListener(ev, () => segnala()));
  window.addEventListener('resize', () => segnala());
  window.addEventListener('focus', () => segnala());
  window.addEventListener('blur', () => setTimeout(segnala, 300)); // il focus nell'iframe di «Prova tu» non conta come uscita
  setInterval(segnala, 2000);

  $('btnEntra').addEventListener('click', () => { entra(); if (room) room.startAudio().catch(() => {}); });
  $('btnAudio').addEventListener('click', () => {
    if (room) room.startAudio().then(aggiornaBtnAudio).catch(() => {});
    if (yt && ytRif){ yt.unMute(); allineaVideo(); yt.playVideo(); }
    $('btnAudio').style.display = 'none'; $('btnAudio').textContent = "Tocca per attivare l'audio";
  });
  // ?auto=1 salta il pulsante (niente schermo intero: serve un clic dell'utente)
  if (qs.get('auto') === '1') entra();
  connetti();
})();
</script>
</body>
</html>
